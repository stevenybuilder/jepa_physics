[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# Default run is offline and CPU-only: model-loading tests are opt-in with `pytest -m slow` (or `-m "slow or not slow"`).
addopts = "-m 'not slow'"
markers = [
    "slow: loads the model and runs the predictor on CPU (minutes)",
    "network: needs model weights from the Hugging Face hub (downloaded on first use, or already in the HF cache)",
]
