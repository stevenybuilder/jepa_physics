[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wm"
version = "0.1.0"
description = "Reading and steering motion in V-JEPA 2: layer-wise probes, nullspace erasure, spline steering, predictor readout"
requires-python = ">=3.11,<3.12"
license = {text = "MIT"}
# torch 2.2.2 needs numpy < 2
dependencies = [
    "torch==2.2.2",
    "transformers==4.56.2",
    "safetensors==0.8.0",
    "av==18.1.0",
    "numpy==1.26.4",
    "scikit-learn==1.9.1",
    "scipy==1.17.1",
    "pandas==3.0.6",
    "matplotlib==3.11.2",
    "pytest==9.1.1",
]

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["wm"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# Default run is offline and CPU-only: model-loading tests are opt-in with `pytest -m slow` (or `-m "slow or not slow"`).
addopts = "-m 'not slow'"
markers = [
    "slow: loads the model and runs the predictor on CPU (minutes)",
    "network: needs model weights from the Hugging Face hub (downloaded on first use, or already in the HF cache)",
]
